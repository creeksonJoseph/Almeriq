<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- ALIMERIQ "Network A" mark - bold strokes scale cleanly to 16px -->
  <!-- Left leg -->
  <line x1="5" y1="39" x2="22" y2="5" stroke="#f2ca50" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="39" y1="39" x2="22" y2="5" stroke="#f2ca50" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="12.5" y1="27" x2="31.5" y2="27" stroke="#f2ca50" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Node: apex convergence point -->
  <circle cx="22" cy="5" r="3.2" fill="#f2ca50"/>
  <!-- Node: crossbar left endpoint -->
  <circle cx="12.5" cy="27" r="2.4" fill="#f2ca50"/>
  <!-- Node: crossbar right endpoint -->
  <circle cx="31.5" cy="27" r="2.4" fill="#f2ca50"/>
</svg>
