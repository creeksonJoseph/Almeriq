services:
  - type: web
    name: alimeriq-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    preDeployCommand: uv run alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DOMAIN
        value: alimeriq.app
      - key: ALLOWED_ORIGINS
        value: https://alimeriq.app,https://www.alimeriq.app,http://localhost:5173,http://localhost:5174