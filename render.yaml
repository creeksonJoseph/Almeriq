services:
  - type: web
    name: alimeriq-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DOMAIN
        value: alimeriq.app
      - key: ALLOWED_ORIGINS
        value: "*"
